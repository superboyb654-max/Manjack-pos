name: Build Manjack POS APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - run: npm install
      - run: npx cap init ManjackPOS com.manjack.pos --web-dir=. --npm-client npm
      - run: npx cap add android || echo "android exists"
      - run: npx cap copy android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Manjack-POS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
