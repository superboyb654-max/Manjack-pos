name: Build Manjack POS APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install and Build APK
        run: |
          npm install --legacy-peer-deps
          mkdir -p www
          echo '<!DOCTYPE html><html><body>Manjack POS</body></html>' > www/index.html
          echo '{"appId":"com.manjack.pos","appName":"ManjackPOS","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
          rm -rf android
          npx cap add android || true
          mkdir -p android/app/src/main/assets
          echo '[]' > android/app/src/main/assets/capacitor.plugins.json || true
          echo '{}' > android/app/src/main/assets/capacitor.config.json || true
          npx cap sync android || true
          npx cap copy android || true
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Manjack-POS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
